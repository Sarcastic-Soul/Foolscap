[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Sarcastic-Soul/Foolscap"
authors = ["Anish Kumar <anishisbusy@gmail.com>"]

[workspace.dependencies]
pdf-core = { path = "crates/pdf-core" }

# 0.44 for password authentication and AES-256 (revision 6) decryption.
# Default features pull in rayon and three date-time crates, none of them used.
lopdf = { version = "0.44", default-features = false }
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
image = { version = "0.25", default-features = false }
flate2 = "1"
rayon = "1"
# v4_10 for FileDialog, which replaced the deprecated FileChooserNative.
gtk4 = { version = "0.11", features = ["v4_10"] }
async-channel = "2"
clap_mangen = "0.2"
clap_complete = "4"
printpdf = { version = "0.12", default-features = false, features = ["jpeg", "png"] }
thiserror = "2"
tracing = "0.1"
# MIT-licensed (AGPL-compatible); used to bundle rasterised pages.
zip = "2"
qrcodegen = "1"
# Signature verification (MIT or Apache-2.0, AGPL-compatible). sha1 backs the
# legacy adbe.pkcs7.sha1 sub-filter; everything newer uses the SHA-2 family.
x509-parser = "0.16"
sha1 = "0.10"
sha2 = "0.10"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
# "env" lets --password be supplied through FOOLSCAP_PASSWORD.
clap = { version = "4", features = ["derive", "string", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
