[package]
name = "pdf-core"
description = "Core PDF manipulation library for Foolscap. No GUI or CLI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Enabled in stage 2. Pulls in mupdf-rs, which vendors and builds the MuPDF C
# sources; expect a long first build. Kept off by default so day-to-day builds
# and CI stay fast.
render = ["dep:mupdf"]
# Enabled in stage 4. Image and Office format conversion.
convert = ["dep:printpdf", "dep:zip", "dep:qrcodegen"]
# Enabled in stage 5. OCR via the Tesseract binary.
# Recognition rasterises pages first, so it needs the renderer too.
ocr = ["render"]
# Rendering plus conversion enables PDF-to-image output.
render-convert = ["render", "convert"]
# Digital signature verification: parsing, byte-range integrity, certificate
# details. Chain-of-trust validation against a system trust store is out of
# scope; the report says what was and was not checked.
signatures = ["dep:x509-parser", "dep:sha1", "dep:sha2", "dep:rsa", "dep:p256"]

[dev-dependencies]
tempfile = "3"
roxmltree = "0.20"

[dependencies]
lopdf.workspace = true
# JPEG for image recompression, PNG for the buffers handed to Tesseract and
# written by page rasterisation.
image = { workspace = true, features = ["jpeg", "png"] }
flate2.workspace = true
rayon.workspace = true
mupdf = { workspace = true, optional = true }
printpdf = { workspace = true, optional = true, features = ["jpeg", "png"] }
zip = { workspace = true, optional = true }
qrcodegen = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
x509-parser = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
