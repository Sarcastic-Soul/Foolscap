# Flatpak manifest for Foolscap.
#
# The point of shipping a Flatpak as well as a .deb is that everything Foolscap
# links against — GTK4, and MuPDF built from the vendored sources — comes from
# the runtime and the build, not from whatever the host distribution happens to
# carry. Fedora, Arch and Debian then all get the same behaviour.
#
# Build with:
#   flatpak install flathub org.gnome.Platform//50 org.gnome.Sdk//50 \
#       org.freedesktop.Sdk.Extension.rust-stable//25.08 \
#       org.freedesktop.Sdk.Extension.llvm20//25.08
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/com.github.sarcastic_soul.Foolscap.yml
#
# cargo-sources.json must be regenerated whenever Cargo.lock changes; see
# packaging/README.md.

app-id: com.github.sarcastic_soul.Foolscap
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # bindgen needs libclang to generate the MuPDF bindings.
  - org.freedesktop.Sdk.Extension.llvm20
command: foolscap-gui

# The source tree names the icon `foolscap` so the .deb can install it as is.
# Flatpak only exports files named after the application id, so the icon is
# renamed here and the desktop entry's Icon= line is rewritten to match.
rename-icon: foolscap

finish-args:
  # Documents are opened through the file chooser portal, so no blanket
  # filesystem access is needed.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    # The build has no network. cargo-sources.json unpacks every crate into
    # cargo/vendor and writes a cargo/config that points crates.io there; that
    # config is only found if CARGO_HOME is this exact directory.
    CARGO_HOME: /run/build/foolscap/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib

modules:
  # Tesseract for OCR. Built from the same pinned sources that were verified
  # by hand against a rendered page on the host. Installed under /app, so it
  # lands on the sandbox PATH and its default tessdata directory,
  # /app/share/tessdata, is found without extra environment.
  - name: leptonica
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_PROG=OFF
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/archive/refs/tags/1.87.0.tar.gz
        sha256: fa2b40c5caea96d1bb93a97486262aed8731b69ce25a84a6bf5d25323e33f631

  - name: tesseract
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_CURL=ON
      - -DOPENMP_BUILD=OFF
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz
        sha256: a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4

  # The fast English model. Other languages need their own traineddata here.
  - name: tessdata-eng
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2

  # LibreOffice is invoked as a subprocess and is not bundled: it would
  # multiply the download size. Office conversion stays unavailable here.
  - name: foolscap
    buildsystem: simple
    build-commands:
      - cargo --offline build --release -p foolscap-cli --features full
      - cargo --offline build --release -p foolscap-gui
      - install -Dm755 target/release/foolscap /app/bin/foolscap
      - install -Dm755 target/release/foolscap-gui /app/bin/foolscap-gui
      - install -Dm644 packaging/com.github.sarcastic_soul.Foolscap.desktop
        /app/share/applications/com.github.sarcastic_soul.Foolscap.desktop
      - install -Dm644 packaging/com.github.sarcastic_soul.Foolscap.metainfo.xml
        /app/share/metainfo/com.github.sarcastic_soul.Foolscap.metainfo.xml
      - install -Dm644 packaging/foolscap.svg
        /app/share/icons/hicolor/scalable/apps/foolscap.svg
    sources:
      - type: dir
        path: ../..
        # A local checkout's build output runs to gigabytes and would be
        # copied into the build directory on every run.
        skip:
          - target
          - dist
          - build-dir
          - .flatpak-builder
          - .claude
      - cargo-sources.json
